name: Build macOS DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write # Grants permission to create GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install create-dmg via Homebrew
        run: |
          brew install create-dmg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Download Gemma Model Weights
        run: |
          mkdir -p models
          curl -L -o models/gemma-2-2b-it-Q4_K_M.gguf \
            "https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf"

      - name: Run Master DMG Build Script
        run: |
          chmod +x build_dmg.sh make_icns.sh
          ./build_dmg.sh

      # Publish to permanent GitHub Release when a tag (e.g. v1.0.0) is pushed
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          body_path: version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
