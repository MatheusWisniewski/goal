name: Build macOS DMGs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: AppleSilicon
          - os: macos-13
            arch: Intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install create-dmg via Homebrew
        run: |
          brew install create-dmg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Download Gemma Model Weights
        run: |
          mkdir -p models
          curl -L -o models/gemma-2-2b-it-Q4_K_M.gguf \
            "https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf"

      - name: Run Master DMG Build Script
        run: |
          chmod +x build_dmg.sh make_icns.sh
          ./build_dmg.sh

      - name: Upload DMG as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalDataLabeler-${{ matrix.arch }}
          path: "*.dmg"
          retention-days: 7

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          body_path: version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
